name: Publish RedPulse Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be MAJOR.MINOR.PATCH" }
          $cargo = Get-Content Cargo.toml -Raw
          if (-not $cargo.Contains("version = `"$version`"")) { throw "Cargo.toml version must match requested release." }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare executable and checksum
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/redpulse.exe"
          Copy-Item $exe RedPulse.exe
          $hash = (Get-FileHash RedPulse.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RedPulse.exe" | Set-Content RedPulse.exe.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          gh release create "v$version" RedPulse.exe RedPulse.exe.sha256 --title "RedPulse v$version" --notes "Windows x64 executable. SHA-256 checksum attached."
