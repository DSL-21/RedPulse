name: Publish RedPulse Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Resolve release version
        id: release_meta
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          if ($eventName -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $cargoText = Get-Content Cargo.toml -Raw
            $versionMatch = [regex]::Match($cargoText, '(?m)^version\s*=\s*"([^"]+)"')
            if (-not $versionMatch.Success) { throw "Could not read package version from Cargo.toml." }
            $version = $versionMatch.Groups[1].Value
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be MAJOR.MINOR.PATCH." }
          $cargoText = Get-Content Cargo.toml -Raw
          $versionMatch = [regex]::Match($cargoText, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success -or $versionMatch.Groups[1].Value -ne $version) {
            throw "Requested release version must match the Cargo package version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check whether release already exists
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: pwsh
        run: |
          gh release list --limit 100 --json tagName | Set-Content release-list.json
          if ($LASTEXITCODE -ne 0) { throw "Could not query existing GitHub releases." }
          $releases = @(Get-Content release-list.json -Raw | ConvertFrom-Json)
          $tag = "v$env:VERSION"
          $exists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          if ($exists) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $tag already exists; skipping duplicate publication."
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Release $tag does not exist; continuing with publication."
          }

      - name: Generate dependency lockfile
        if: steps.release_state.outputs.exists != 'true'
        run: cargo generate-lockfile

      - name: Commit Cargo.lock to main
        id: source_commit
        if: steps.release_state.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: lock dependencies for v$env:VERSION"
            git push origin HEAD:main
          }
          $targetSha = (git rev-parse HEAD).Trim()
          "target_sha=$targetSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check Rust formatting
        if: steps.release_state.outputs.exists != 'true'
        run: cargo fmt --all -- --check

      - name: Run tests
        if: steps.release_state.outputs.exists != 'true'
        run: cargo test --locked --all

      - name: Run Clippy
        if: steps.release_state.outputs.exists != 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build Windows x64 release
        if: steps.release_state.outputs.exists != 'true'
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Prepare executable and SHA-256 checksum
        if: steps.release_state.outputs.exists != 'true'
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/redpulse.exe"
          if (-not (Test-Path $exe)) { throw "Release executable was not produced." }
          Copy-Item $exe RedPulse.exe
          $hash = (Get-FileHash RedPulse.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RedPulse.exe" | Set-Content RedPulse.exe.sha256 -Encoding ascii
          Write-Host "SHA-256: $hash"

      - name: Publish public GitHub Release
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          TARGET_SHA: ${{ steps.source_commit.outputs.target_sha }}
        shell: pwsh
        run: |
          gh release create "v$env:VERSION" RedPulse.exe RedPulse.exe.sha256 `
            --title "RedPulse v$env:VERSION" `
            --notes-file RELEASE_NOTES.md `
            --target "$env:TARGET_SHA"
