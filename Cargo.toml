[package]
name = "redpulse"
version = "0.5.0"
edition = "2024"
description = "High-performance Windows HTTP load testing with Multi-IP routing and hardware telemetry"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
async-channel = "2"
eframe = "0.31"
egui = "0.31"
egui_plot = "0.32"
hdrhistogram = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.4", default-features = false, features = ["network", "system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
