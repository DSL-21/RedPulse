[package]
name = "redpulse"
version = "0.3.0"
edition = "2024"
description = "Native Rust high-performance HTTP load testing and resilience workbench"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.31"
egui = "0.31"
egui_plot = "0.32"
hdrhistogram = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
